<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Monthly Attendance</title>
    
    <!-- Fonts to support Material Design -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- MUI -->
    <script crossorigin src="https://unpkg.com/@mui/material@5/umd/material-ui.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        const {
            Table,
            TableBody,
            TableCell,
            TableContainer,
            TableHead,
            TableRow,
            Paper,
            TextField,
            Box,
            Button,
            Typography,
            Checkbox,
            FormControlLabel
        } = MaterialUI;

        function AttendanceTable() {
            const now = new Date();
            // Default the calendar to May 2025 to match the hardcoded mock data
            const initialMonthYear = '2025-05';
            const currentRealMonthYear = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            const [selectedMonthYear, setSelectedMonthYear] = useState(initialMonthYear); 
            const [showOnlyToday, setShowOnlyToday] = useState(false);

            let currentYear = now.getFullYear();
            let selectedMonth = now.getMonth() + 1;
            
            if (selectedMonthYear) {
                const [yearStr, monthStr] = selectedMonthYear.split('-');
                currentYear = parseInt(yearStr, 10);
                selectedMonth = parseInt(monthStr, 10);
            }

            const getDaysInMonth = (month, year) => {
                return new Date(year, month, 0).getDate();
            };
            
            const daysInMonth = getDaysInMonth(selectedMonth, currentYear);
            const daysArray = daysInMonth ? Array.from({ length: daysInMonth }, (_, i) => i + 1) : [];

            // Filter to show only today's date column if the checkbox is checked
            let displayedDays = daysArray;
            if (showOnlyToday && selectedMonthYear === currentRealMonthYear) {
                displayedDays = [now.getDate()];
            }
            const todayDateString = `${String(now.getDate()).padStart(2, '0')}-${String(now.getMonth() + 1).padStart(2, '0')}-${now.getFullYear()}`;

            // Dynamically generate the current month and year suffix (e.g., "10-2023")
            const currentMMYYYY = `${String(selectedMonth).padStart(2, '0')}-${currentYear}`;

            const [students, setStudents] = useState([
                { id: 1, name: 'Alice Smith', attendance: { '01-05-2025': 'P', '02-04-2025': 'P', '03-05-2025': 'A', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'M' } },
                { id: 2, name: 'Bob Johnson', attendance: { '01-05-2025': 'P', '02-05-2025': 'A', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'M' } },
                { id: 3, name: 'Charlie Brown', attendance: { '01-05-2025': 'A', '02-05-2025': 'A', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 4, name: 'Diana Prince', attendance: { '01-05-2025': 'P', '02-05-2025': 'P', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '30-05-2025': 'M' } },
                { id: 5, name: 'Eve Davis', attendance: { '01-05-2025': 'P', '02-05-2025': 'A', '03-05-2025': 'A', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 6, name: 'Frank Miller', attendance: { '01-05-2025': 'M', '02-05-2025': 'P', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 7, name: 'Grace Wilson', attendance: { '01-05-2025': 'P', '02-05-2025': 'P', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'A' } },
                { id: 8, name: 'Harry Taylor', attendance: { '01-05-2025': 'A', '02-05-2025': 'M', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 9, name: 'Ivy Moore', attendance: { '01-05-2025': 'P', '02-05-2025': 'P', '03-05-2025': 'M', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'M' } },
                { id: 10, name: 'Jack Anderson', attendance: { '01-05-2025': 'P', '02-05-2025': 'P', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 11, name: 'Kevin Thomas', attendance: { '01-05-2025': 'P', '02-05-2025': 'A', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 12, name: 'Liam Jackson', attendance: { '01-05-2025': 'M', '02-05-2025': 'P', '03-05-2025': 'A', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'M' } },
                { id: 13, name: 'Mia White', attendance: { '01-05-2025': 'A', '02-05-2025': 'A', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 14, name: 'Noah Harris', attendance: { '01-05-2025': 'P', '02-05-2025': 'M', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'A' } },
                { id: 15, name: 'Olivia Martin', attendance: { '01-05-2025': 'P', '02-05-2025': 'P', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 16, name: 'Paul Thompson', attendance: { '01-05-2025': 'P', '02-05-2025': 'P', '03-05-2025': 'A', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 17, name: 'Quinn Garcia', attendance: { '01-05-2025': 'M', '02-05-2025': 'P', '03-05-2025': 'A', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'M' } },
                { id: 18, name: 'Rachel Martinez', attendance: { '01-05-2025': 'P', '02-05-2025': 'A', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 19, name: 'Sam Robinson', attendance: { '01-05-2025': 'P', '02-05-2025': 'P', '03-05-2025': 'M', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 20, name: 'Tina Clark', attendance: { '01-05-2025': 'P', '02-05-2025': 'P', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'A' } },
                { id: 21, name: 'Uma Rodriguez', attendance: { '01-05-2025': 'M', '02-05-2025': 'P', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'M' } },
                { id: 22, name: 'Victor Lewis', attendance: { '01-05-2025': 'A', '02-05-2025': 'A', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 23, name: 'Wendy Lee', attendance: { '01-05-2025': 'P', '02-05-2025': 'P', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 24, name: 'Xander Walker', attendance: { '01-05-2025': 'P', '02-05-2025': 'M', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 25, name: 'Yara Hall', attendance: { '01-05-2025': 'A', '02-05-2025': 'A', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 26, name: 'Zack Allen', attendance: { '01-05-2025': 'P', '02-05-2025': 'P', '03-05-2025': 'M', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 27, name: 'Amy Young', attendance: { '01-05-2025': 'P', '02-05-2025': 'P', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'M' } },
                { id: 28, name: 'Brian Hernandez', attendance: { '01-05-2025': 'P', '02-05-2025': 'A', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 29, name: 'Chloe King', attendance: { '01-05-2025': 'M', '02-05-2025': 'M', '03-05-2025': 'A', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 30, name: 'Daniel Wright', attendance: { '01-05-2025': 'P', '02-05-2025': 'P', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 31, name: 'Emma Lopez', attendance: { '01-05-2025': 'P', '02-05-2025': 'P', '03-05-2025': 'A', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 32, name: 'Finn Hill', attendance: { '01-05-2025': 'A', '02-05-2025': 'A', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'M' } },
                { id: 33, name: 'Gina Scott', attendance: { '01-05-2025': 'P', '02-05-2025': 'P', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 34, name: 'Henry Green', attendance: { '01-05-2025': 'M', '02-05-2025': 'P', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'A' } },
                { id: 35, name: 'Isabella Adams', attendance: { '01-05-2025': 'P', '02-05-2025': 'A', '03-05-2025': 'A', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 36, name: 'Jacob Baker', attendance: { '01-05-2025': 'P', '02-05-2025': 'P', '03-05-2025': 'M', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 37, name: 'Katie Gonzalez', attendance: { '01-05-2025': 'P', '02-05-2025': 'P', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'A' } },
                { id: 38, name: 'Leo Nelson', attendance: { '01-05-2025': 'A', '02-05-2025': 'P', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'M' } },
                { id: 39, name: 'Mona Carter', attendance: { '01-05-2025': 'M', '02-05-2025': 'P', '03-05-2025': 'A', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 40, name: 'Nate Mitchell', attendance: { '01-05-2025': 'P', '02-05-2025': 'P', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 41, name: 'Oscar Perez', attendance: { '01-05-2025': 'P', '02-05-2025': 'M', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'A' } },
                { id: 42, name: 'Penny Roberts', attendance: { '01-05-2025': 'A', '02-05-2025': 'A', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 43, name: 'Quincy Turner', attendance: { '01-05-2025': 'M', '02-05-2025': 'P', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'M' } },
                { id: 44, name: 'Riley Phillips', attendance: { '01-05-2025': 'P', '02-05-2025': 'P', '03-05-2025': 'A', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 45, name: 'Steve Campbell', attendance: { '01-05-2025': 'P', '02-05-2025': 'P', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 46, name: 'Tracy Parker', attendance: { '01-05-2025': 'A', '02-05-2025': 'P', '03-05-2025': 'M', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
                { id: 47, name: 'Ulysses Evans', attendance: { '01-05-2025': 'P', '02-05-2025': 'A', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'M' } },
                { id: 48, name: 'Vera Edwards', attendance: { '01-05-2025': 'P', '02-05-2025': 'P', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'A' } },
                { id: 49, name: 'Wyatt Collins', attendance: { '01-05-2025': 'M', '02-05-2025': 'P', '03-05-2025': 'P', '04-05-2025': 'H', '05-05-2025': 'N', '06-05-2025': 'P' } },
            ]);

            const handleCellClick = (studentId, dateKey) => {
                if (!showOnlyToday) return; // Only allow editing when viewing 'Today' specifically

                setStudents(prevStudents => prevStudents.map(student => {
                    if (student.id === studentId) {
                        const currentStatus = student.attendance[dateKey] || '-';
                        let nextStatus = 'P';
                        if (currentStatus === 'P') nextStatus = 'A';
                        else if (currentStatus === 'A') nextStatus = 'M';
                        else if (currentStatus === 'M') nextStatus = 'P';
                        
                        return { ...student, attendance: { ...student.attendance, [dateKey]: nextStatus } };
                    }
                    return student;
                }));
            };

            const handleSubmitToday = () => {
                if (window.confirm("Are you sure you want to submit today's attendance?")) {
                    alert("Today's attendance submitted successfully!");
                }
            };

            return (
                <Box sx={{ p: 0, m: 0}}>
                    <Typography variant="h5" gutterBottom sx={{ pt: 1 }}>
                        Attendance
                    </Typography>

                    <Box>
                            <Box sx={{ display: 'flex', alignItems: 'center', flexWrap: 'wrap', gap: 1, mb: 1 }}>
                                <TextField
                                    label="Select Month & Year"
                                    type="month"
                                    value={selectedMonthYear}
                                    onChange={(e) => {
                                        setSelectedMonthYear(e.target.value);
                                        setShowOnlyToday(false); // Uncheck if manually changing month
                                    }}
                                    InputLabelProps={{ shrink: true }}
                                    sx={{ minWidth: 200 }}
                                />
                                <FormControlLabel
                                    control={
                                        <Checkbox
                                            checked={showOnlyToday}
                                            onChange={(e) => {
                                                const isChecked = e.target.checked;
                                                setShowOnlyToday(isChecked);
                                                if (isChecked) {
                                                    setSelectedMonthYear(currentRealMonthYear);
                                                }
                                            }}
                                            color="primary"
                                        />
                                    }
                                    label={
                                        <Typography sx={{ fontSize: { xs: '0.8rem', sm: '1rem' } }}>
                                            Take Today Attendance ({todayDateString})
                                        </Typography>
                                    }
                                />
                            </Box>

                            {/* Abbreviations Legend */}
                            <Box sx={{ display: 'flex', gap: 1, mb: 1, flexWrap: 'wrap', alignItems: 'center' }}>
                                <Typography sx={{ display: 'flex', alignItems: 'center', gap: 0.4, color: 'text.secondary', fontWeight: 'medium', fontSize: '0.5rem' }}><Box component="span" sx={{ bgcolor: '#e8f5e9', color: '#2e7d32', px: 0.4, py: 0, borderRadius: 0.5, fontWeight: 'bold', fontSize: '0.55rem' }}>P</Box> Present</Typography>
                                <Typography sx={{ display: 'flex', alignItems: 'center', gap: 0.4, color: 'text.secondary', fontWeight: 'medium', fontSize: '0.5rem' }}><Box component="span" sx={{ bgcolor: '#ffebee', color: '#c62828', px: 0.4, py: 0, borderRadius: 0.5, fontWeight: 'bold', fontSize: '0.55rem' }}>A</Box> Absent</Typography>
                                <Typography sx={{ display: 'flex', alignItems: 'center', gap: 0.4, color: 'text.secondary', fontWeight: 'medium', fontSize: '0.5rem' }}><Box component="span" sx={{ bgcolor: '#e3f2fd', color: '#1565c0', px: 0.4, py: 0, borderRadius: 0.5, fontWeight: 'bold', fontSize: '0.55rem' }}>M</Box> Half Day</Typography>
                                <Typography sx={{ display: 'flex', alignItems: 'center', gap: 0.4, color: 'text.secondary', fontWeight: 'medium', fontSize: '0.5rem' }}><Box component="span" sx={{ bgcolor: '#fff3e0', color: '#ef6c00', px: 0.4, py: 0, borderRadius: 0.5, fontWeight: 'bold', fontSize: '0.55rem' }}>H</Box> Holiday</Typography>
                                <Typography sx={{ display: 'flex', alignItems: 'center', gap: 0.4, color: 'text.secondary', fontWeight: 'medium', fontSize: '0.5rem' }}><Box component="span" sx={{ bgcolor: '#f5f5f5', color: '#757575', px: 0.4, py: 0, borderRadius: 0.5, fontWeight: 'bold', fontSize: '0.55rem' }}>N</Box> Non-Working Day</Typography>
                            </Box>

                            <TableContainer component={Paper} sx={{ maxHeight: 600, overflow: 'auto' }}>
                                <Table stickyHeader sx={{ minWidth: displayedDays.length > 1 ? 1200 : '100%' }} size="small">
                                    <TableHead>
                                        <TableRow>
                                            <TableCell 
                                                sx={{ 
                                                    fontWeight: 'bold', 
                                                    minWidth: { xs: 110, sm: 150 }, 
                                                    position: 'sticky', 
                                                    left: 0, 
                                                    backgroundColor: '#f5f5f5', 
                                                    zIndex: 3,
                                                    borderRight: '1px solid #e0e0e0'
                                                }}
                                            >
                                                Student Name
                                            </TableCell>
                                            
                                            {displayedDays.map((day) => (
                                                <TableCell 
                                                    key={day} 
                                                    align="center" 
                                                    sx={{ 
                                                        fontWeight: 'bold', 
                                                        minWidth: 40, 
                                                        backgroundColor: '#f5f5f5', 
                                                        zIndex: 2,
                                                        borderRight: '1px solid #e0e0e0'
                                                    }}
                                                >
                                                    {day}
                                                </TableCell>
                                            ))}
                                            {!showOnlyToday && <TableCell align="center" sx={{ fontWeight: 'bold', minWidth: 60, backgroundColor: '#f5f5f5', zIndex: 2, borderRight: '1px solid #e0e0e0' }}>Ratio</TableCell>}
                                            {!showOnlyToday && <TableCell align="center" sx={{ fontWeight: 'bold', minWidth: 80, backgroundColor: '#f5f5f5', zIndex: 2, borderRight: '1px solid #e0e0e0' }}>Percentage</TableCell>}
                                        </TableRow>
                                    </TableHead>
                                    
                                    <TableBody>
                                        {students.map((student) => {
                                            // Calculate Monthly Ratio and Percentage
                                            let presentCount = 0;
                                            let validDays = 0;
                                            
                                            daysArray.forEach(day => {
                                                const dateKey = `${String(day).padStart(2, '0')}-${currentMMYYYY}`;
                                                const status = student.attendance[dateKey];
                                                if (status === 'P') { presentCount += 1; validDays += 1; }
                                                else if (status === 'A') { validDays += 1; }
                                                else if (status === 'M') { presentCount += 0.5; validDays += 1; }
                                            });

                                            const ratio = validDays > 0 ? `${presentCount}/${validDays}` : '-';
                                            const percentage = validDays > 0 ? `${Math.round((presentCount / validDays) * 100)}%` : '-';

                                            return (
                                                <TableRow key={student.id} hover>
                                                <TableCell 
                                                    sx={{ 
                                                        position: 'sticky', 
                                                        left: 0, 
                                                        backgroundColor: 'white', 
                                                        zIndex: 1,
                                                        fontWeight: 'medium',
                                                        borderRight: '1px solid #e0e0e0'
                                                    }}
                                                >
                                                    {student.name}
                                                </TableCell>
                                                
                                                {displayedDays.map((day) => {
                                                    // Construct the full date string to look up attendance (DD-MM-YYYY format)
                                                    const dateKey = `${String(day).padStart(2, '0')}-${currentMMYYYY}`;
                                                    const status = student.attendance[dateKey] || '-'; 
                                                    
                                                    // Assign color mapping based on status type
                                                    let statusColor = 'text.primary';
                                                    if (status === 'P') statusColor = 'green';
                                                    else if (status === 'A') statusColor = 'red';
                                                    else if (status === 'H') statusColor = '#ff9800'; // Orange
                                                    else if (status === 'N') statusColor = '#9e9e9e'; // Grey
                                                    else if (status === 'M') statusColor = '#2196f3'; // Blue

                                                    return (
                                                        <TableCell 
                                                            key={day} 
                                                            align="center"
                                                            onClick={() => handleCellClick(student.id, dateKey)}
                                                            sx={{
                                                                color: statusColor,
                                                                fontWeight: status !== '-' ? 'bold' : 'normal',
                                                                borderRight: '1px solid #e0e0e0',
                                                                cursor: showOnlyToday ? 'pointer' : 'default',
                                                                userSelect: showOnlyToday ? 'none' : 'auto'
                                                            }}
                                                        >
                                                            {status}
                                                        </TableCell>
                                                    );
                                                })}
                                                
                                                {!showOnlyToday && <TableCell align="center" sx={{ fontWeight: 'bold', borderRight: '1px solid #e0e0e0' }}>{ratio}</TableCell>}
                                                {!showOnlyToday && <TableCell align="center" sx={{ fontWeight: 'bold', borderRight: '1px solid #e0e0e0', color: percentage === '-' ? 'text.primary' : (parseFloat(percentage) >= 75 ? 'green' : 'red') }}>{percentage}</TableCell>}
                                            </TableRow>
                                            );
                                        })}
                                    </TableBody>
                                </Table>
                            </TableContainer>

                            {showOnlyToday && (
                                <Box sx={{ mt: 3, textAlign: 'center' }}>
                                    <Button variant="contained" color="primary" onClick={handleSubmitToday}>
                                        Submit Today Attendance
                                    </Button>
                                </Box>
                            )}
                        </Box>
                </Box>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AttendanceTable />);
    </script>
</body>
</html>
